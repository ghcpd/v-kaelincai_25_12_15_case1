<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login — Demo</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="brand">Acme App</h1>
      <p class="lead">Sign in to your account</p>

      <form id="login-form" class="form" novalidate>
        <label for="email" class="label">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required />

        <label for="password" class="label">Password</label>
        <div class="password-wrapper">
          <input id="password" name="password" type="password" placeholder="Enter your password" required />

          <button type="button" class="password-toggle" aria-label="Toggle password visibility" title="Show password">
            <!-- Eye Closed (initial) -->
            <svg class="icon icon-closed" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>

            <!-- Eye Open -->
            <svg class="icon icon-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" style="display:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>

        <button id="login-btn" class="btn-login" type="submit">
          <span class="loading-spinner" aria-hidden="true"></span>
          <span class="btn-text">Login</span>
        </button>
      </form>

      <p class="hint">Tip: use an email containing the word <code>success</code> to simulate a successful login.</p>
    </section>
  </main>

  <script src="js/main.js" defer></script>
</body>
</html>
